# ─────────────────────────────────────────────────────────────
# GitHub Actions Workflow — AI Stock Scanner
# Jadwal: Senin–Jumat pukul 16:30 WIB = 09:30 UTC
# ─────────────────────────────────────────────────────────────
name: AI Stock Scanner Daily Run

on:
  schedule:
    # Senin–Jumat 09:30 UTC = 16:30 WIB
    # Format: menit jam hari bulan hari-minggu
    # 0 = Minggu, 1 = Senin, ..., 5 = Jumat, 6 = Sabtu
    - cron: '30 9 * * 1-5'

  # Tombol "Run workflow" manual di GitHub Actions UI
  workflow_dispatch:

jobs:
  run-bot-saham:
    name: Analisis Saham Perbankan IDX
    runs-on: ubuntu-latest

    env:
      # Menghilangkan warning Node.js dari actions pihak ketiga
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Paksa output Python tidak di-buffer (log tampil real-time di GH)
      PYTHONUNBUFFERED: "1"

    steps:
      # ── Step 1: Ambil source code ──────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 2: Siapkan Python 3.12 ───────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Cache pip agar install lebih cepat pada run berikutnya
          cache: 'pip'

      # ── Step 3: Install dependencies ──────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Jalankan bot (secrets di-inject sebagai env) ─
      - name: Run AI Stock Bot
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
        run: python bot_saham.py
