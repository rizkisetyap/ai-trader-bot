name: AI Stock Scanner Daily Run

on:
  schedule:
    # Menjalankan otomatis setiap hari Senin - Jumat pukul 09:30 UTC (16:30 WIB)
    - cron: '30 9 * * 0,6' # Testing  a week, every Sunday at 9:30 UTC (16:30 WIB)
    # - cron: '30 9 * * 1-5' // defaultnya menggunakan UTC, jadi 9:30 UTC = 16:30 WIB
  workflow_dispatch:
    # Fitur ini opsional, agar Anda bisa menekan tombol "Run" manual dari web GitHub

jobs:
  run-bot-saham:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Menghilangkan warning Node.js

    steps:
    # 1. Mengunduh source code dari repositori ke server GitHub
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Menyiapkan lingkungan Python di server
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Menginstal semua library yang terdaftar di requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Mengeksekusi skrip bot saham dengan menyuntikkan GitHub Secrets sebagai Environment Variables
    - name: Run Stock Bot AI
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python bot_saham.py
